name: Mirror to Personal Repository

on:
  push:
    branches:
      - dev

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add mirror remote
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git remote add mirror https://x-access-token:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git

      # - name: Push mirror
      #   run: |
      #     git push --mirror mirror

      - name: Verify remote
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git ls-remote https://x-access-token:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git
      - name: Add mirror remote
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git remote add mirror https://x-access-token:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git

      - name: Debug mirror remote
        run: |
          git remote -v
          git remote get-url mirror
          git config --get remote.mirror.url

      # - name: Push
      #   run: |
      #     git push --mirror mirror
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git push --mirror https://x-access-token:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git

