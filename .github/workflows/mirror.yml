name: Debug Token

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          echo "Length: ${#GH_TOKEN}"

      - name: GitHub API
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: token ${GH_TOKEN}" \
            https://api.github.com/user