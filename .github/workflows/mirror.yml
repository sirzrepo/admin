name: Mirror to Personal Repository

on:
  push:
    branches:
      - dev

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git remote add mirror https://username:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git

          git push mirror --all
          git push mirror --tags

      - name: Add mirror remote
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git remote add mirror https://username:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git

      - name: Push mirror
        run: |
          git push --mirror mirror

      - name: Verify remote
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git ls-remote https://username:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git

    # git remote set-url origin https://username:token@github.com/put_username_here/repo-name.git


      
          

