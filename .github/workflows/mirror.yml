name: Debug Token

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          echo "Length: ${#GH_TOKEN}"

      - name: GitHub API
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: token ${GH_TOKEN}" \
            https://api.github.com/user
          
      - name: Check repository access
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: token ${GH_TOKEN}" \
            https://api.github.com/repos/Mhatons/sirz_admin_ai

      - name: Test Git over HTTPS
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          GIT_CURL_VERBOSE=1 git ls-remote https://x-access-token:${GH_TOKEN}@github.com/Mhatons/sirz_admin_ai.git